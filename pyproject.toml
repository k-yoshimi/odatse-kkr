[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "odatse-kkr"
version = "0.1.0"
description = "Shared AkaiKKR/ODAT-SE helpers (MPI, workdir, command utilities)"
authors = [{ name = "ODAT-SE contributors" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/k-yoshimi/odatse-kkr"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
